[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysone"
version = "0.1.0"
description = "SysOne：本地决策推理引擎（System-1 速度的边缘 AI）"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Apple（ANE / Metal）运行时与厂商代码桥，M1/M2 起启用。
apple = []
vendor = ["torch>=2.6", "safetensors>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
sysone = "sysone.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sysone*"]
