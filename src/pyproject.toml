[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 只支持从源码树安装（README 的 `pip install -e ./src` / `PYTHONPATH=src`）：Metal 核源在
# `sysone/devices/apple/shaders/`，`env.scratch_root` 也锚在源码树；非 editable 安装不在支持
# 范围内，所以这里不声明 package-data，也不承诺 wheel 可移植。
[project]
name = "sysone"
version = "0.1.0"
description = "SysOne：本地决策推理引擎（System-1 速度的边缘 AI）"
requires-python = ">=3.11"
# 文本侧（分词 + 聊天模板）由 tokenizers / jinja2 直接提供：出货路径不 import transformers。
dependencies = ["numpy>=1.24", "tokenizers>=0.20", "jinja2>=3.1"]

[project.optional-dependencies]
# Apple（ANE / Metal）运行时与厂商代码桥，M1/M2 起启用。
apple = []
# 厂商参考实现（h2o / torchcast）：要 torch 与 transformers 才能构造它们自己的结构。
vendor = ["torch>=2.6", "safetensors>=0.4", "transformers"]
dev = ["pytest>=8"]

[project.scripts]
sysone = "sysone.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sysone*"]
