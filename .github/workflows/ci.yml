name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (reference path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "./src[dev]"
      - run: python -m pytest tests
      - run: python -m sysone.cli inspect --model mude --weights tests/fixtures/mude
      - run: python -m sysone.cli inspect --model h2o --weights tests/fixtures/h2o
      - run: python -m sysone.cli doctor --platform reference

  macos:
    name: macOS (native dylibs)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "./src[dev]"
      - run: tools/build_ane.sh
      - run: python -m sysone.cli doctor --platform apple
      - run: python -m pytest tests
