<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="title desc" font-family='ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
  <title id="title">h2o on 111 questions: 136.03 s on SysOne against 1137.30 s on the vendor's torch engine</title>
  <desc id="desc">Bar chart of total wall clock for the same 111 questions, same int8 weights and same full-bidirectional mask. SysOne runs 136.03 seconds with the ANE and the GPU overlapping; the vendor's own torch engine on MPS runs 1137.30 seconds, 8.4 times longer.</desc>

  <!-- 白底卡片：GitHub 的浅色与深色主题都直接显示它，不依赖 currentColor。
       数据：docs/collective-decision/results/h2o-hard.jsonl（厂商，MPS 111 题 latency_s 合计）
       与 .scratch/h2o_noncausal_111.json（我们这条链，同题同形状）。改数字时条宽按比例重算。 -->
  <rect x="0.5" y="0.5" width="759" height="199" rx="8" fill="#ffffff" stroke="#d0d7de"/>

  <text x="24" y="34" font-size="13" fill="#59636e">h2o 4B int8 · 111 questions · one per request · noncausal_full</text>

  <text x="230" y="92" font-size="15" fill="#1f2328" text-anchor="end">SysOne — ANE + Metal</text>
  <rect x="248" y="74" width="392" height="26" rx="4" fill="#f0f3f6"/>
  <!-- 条宽与秒数严格成比例：136.03 / 1137.30 × 392 = 46.886，取到百分位，测试按比例核对。 -->
  <rect x="248" y="74" width="46.886" height="26" rx="4" fill="#1f6feb"/>
  <text x="305" y="92" font-size="13" fill="#1a7f37">8.4× less wall clock</text>
  <text x="736" y="92" font-size="15" font-weight="600" fill="#1f2328" text-anchor="end">136.03 s</text>

  <text x="230" y="134" font-size="15" fill="#1f2328" text-anchor="end">vendor — torch, MPS</text>
  <rect x="248" y="116" width="392" height="26" rx="4" fill="#f0f3f6"/>
  <rect x="248" y="116" width="392" height="26" rx="4" fill="#afb8c1"/>
  <text x="736" y="134" font-size="15" font-weight="600" fill="#1f2328" text-anchor="end">1137.30 s</text>

  <text x="24" y="176" font-size="13" fill="#59636e">one question: 1.2 s against 10.2 s · loading and artifact build excluded</text>
</svg>
